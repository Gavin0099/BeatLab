</style></head><body><main><header><h1>節奏小島</h1><span>第 1 關 · 60 BPM</span></header>

<div class="feedback" id="feedback" role="status" aria-live="polite">恐龍準備好了！</div><section id="result" hidden aria-live="polite"></section>
