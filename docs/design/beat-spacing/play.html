<main><header><span>拍拍冒險</span><small>第一關 · 60 BPM</small></header><p><label><input id="stable" type="checkbox" checked> Fixed beat arrivals (off: compare early disappearance)</label></p><h1>把恐龍蛋帶回家</h1><p><label><input id="smooth" type="checkbox" checked> 連續動作幀（關閉可比較上一版）</label></p><p id="intro">先聽 4 拍。石頭來到腳下，跟鼓聲按一下「跳」！</p><div class="meter" aria-label="回巢進度"><i id="progress"></i></div><div class="scene"><canvas id="world" aria-label="恐龍帶著蛋，跟著拍子跨過石頭前往巢穴"></canvas><span class="badge" id="badge">目的地：溫暖的巢</span></div><div id="result" hidden></div><div class="cue" id="cue">16 個拍點，陪恐龍一路回家</div><div id="stats"><span id="hits">跨過 0 / 16</span><span id="combo">蛋準備好了</span></div><button id="action">出發！</button><button id="stop" hidden>停止這次冒險</button><p class="muted">用右手跟拍。慢一點也沒關係，下個拍子再接上。</p><footer>可玩的設計試稿；瀏覽器音訊與判定獨立，不保存 App 進度。原生版沿用 BeatLab 的音訊時鐘及判分。</footer></main>

function eased(x){x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)}
function animationFrame(t,age,rm){
 if(rm||!Number.isFinite(t)||t<4||t>20.18)return 14;

 if(age!==null&&Number.isFinite(age)&&age>=0&&age<.48)return 8+Math.min(5,Math.floor(age/.48*6));
