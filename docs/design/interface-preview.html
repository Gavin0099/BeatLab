;let screen='home',tempo=80,playing=false;const app=document.querySelector('#app');const dialog=document.querySelector('#lessons');

function home(){const lesson=catalog.lessons[0];return `<div class="stack"><h2>今天，找到你的節奏</h2><p class="muted">一小段練習，從舒服的速度開始。</p></div><section class="card stack"><div class="row spread"><span class="accent semibold small">從第一拍開始</span>${icon('tap')}</div><h1>${lesson.title.slice(3)}</h1><p class="muted">${lesson.instruction}</p><div class="row"><span class="pill">${icon('tempo')}60 BPM</span><span class="pill">4 小節</span></div>${button('開始今天的練習','practice')}</section><section class="stack"><div class="row spread"><h3>我的節奏旅程</h3><span class="muted numbers small">0 / 10 關</span></div><div class="progress" role="progressbar" aria-label="課程進度" aria-valuenow="0" aria-valuemin="0" aria-valuemax="10"></div><p class="small muted">完成一關，就能解鎖下一個節奏。</p></section><section class="card stack"><h2>自由節拍器</h2><p class="muted small">先聽拍子，也可以跟著打。</p><h3 class="numbers">80 BPM · 4/4</h3><p class="small muted">四分音符 · 第一拍重音：開啟</p>${button('打開節拍器','metronome',false,'tempo')}</section>`}

function session(){return `<h2>左右輪流</h2><p class="accent semibold">換你了，跟上節奏！</p><div class="progress" role="progressbar" aria-label="練習示範進度" aria-valuenow="35" aria-valuemin="0" aria-valuemax="100"><div class="progress-fill" style="width:35%"></div></div><section class="card stack">${beats()}${lane(['R','L','R','L'],1)}</section>`}
function result(){return `<section class="card stack"><div class="row" style="color:var(--reward)">${icon('star')}<span class="small semibold">結果示範</span></div><h1>做到了！<br>節奏跟上了</h1><div class="stars" aria-label="示範三顆星">★★★</div><p class="muted">星星已保存。準備好，就試試下一個節奏。</p><div class="stats"><div class="stat"><strong class="numbers">16/16</strong><span class="small muted">跟上的拍</span></div><div class="stat"><strong class="numbers">100%</strong><span class="small muted">剛剛好</span></div></div>${button('挑戰下一關','practice',true,'arrow')}${button('再練一次','session',false,'tap')}</section>${button('回到課程列表','lessons',false,'list')}`}
function bottom(key){if(key==='metronome')return `<div class="bottom">${button(playing?'停止節拍':'開始節拍','transport',true,playing?'stop':'play')}</div>`;if(key==='session')return `<div class="bottom"><button class="tap" data-action="tap" aria-label="跟拍區">${icon('check')}<strong id="feedback">剛剛好！</strong><span class="small muted">跟著格子，點這裡</span></button>${button('停止練習','practice',false,'stop')}<p class="caption muted center">停止後，這次不計成績。</p><button class="plain" data-action="result">查看結果示範</button></div>`;return ''}
function shell(key){const title={home:'BeatLab',metronome:'節拍器',practice:'練習',session:'練習',result:'練習'}[key];const body={home,metronome,practice,session,result}[key]();return `<div class="shell"><div class="top">${title}</div><div class="content">${body}</div>${bottom(key)}${tabs(['session','result'].includes(key)?'practice':key)}</div>`}
function render(){const board=document.querySelector('#board').checked;app.innerHTML=board?`<div class="board">${[['home','首頁'],['metronome','節拍器'],['session','練習中 · 示範'],['result','結果 · 示範成績']].map(([key,label])=>`<div><div class="board-label">${label}</div>${shell(key)}</div>`).join('')}</div>`:shell(screen)}
function navigate(key){screen=key;render();window.scrollTo(0,0)}
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.screen){navigate(b.dataset.screen);return}if(b.dataset.delta){tempo=Math.max(30,Math.min(240,tempo+Number(b.dataset.delta)));render();return}const a=b.dataset.action;if(['home','metronome','practice','session','result'].includes(a)){navigate(a);return}if(a==='transport'){playing=!playing;render()}if(a==='tap'){document.querySelector('#feedback').textContent='剛剛好！'}if(a==='tap-tempo'){document.querySelector('#tap-status').textContent='預覽不計算 Tap Tempo；App 使用 audio host clock。'}if(a==='lessons'){document.querySelector('#lesson-rows').innerHTML=catalog.lessons.map((l,i)=>`<button class="lesson-row" data-lesson="${i}" ${i?'disabled':''}><span class="lesson-number">${i?icon('stop'):'01'}</span><span><strong>${l.title.slice(3)}</strong><br><span class="muted small">${i?`完成第 ${i} 關後解鎖`:`${l.bpm} BPM · 準備開始`}</span></span></button>`).join('');dialog.showModal()}});
app.addEventListener('input',e=>{if(e.target.id==='tempo-slider'){tempo=Number(e.target.value);document.querySelector('#tempo-value').textContent=tempo}});
dialog.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.action==='close-dialog')dialog.close();if(b.dataset.lesson==='0'){dialog.close();navigate('practice')}});
['dark','large','board'].forEach(id=>document.querySelector('#'+id).addEventListener('change',e=>{if(id==='board')render();else document.body.classList.toggle(id,e.target.checked)}));
const params=new URLSearchParams(location.search);for(const id of ['dark','large','board'])if(params.has(id)){document.querySelector('#'+id).checked=true;document.body.classList.toggle(id,id!=='board')}screen=params.get('screen')||'home';if(!['home','metronome','practice','session','result'].includes(screen))screen='home';render();
</script></body></html>
