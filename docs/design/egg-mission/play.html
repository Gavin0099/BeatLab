<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>拍拍冒險 · 送蛋回巢試玩</title>
<style>
:root{color-scheme:light;--ink:#163d30;--yellow:#ffdb70;--cream:#fff8df}*{box-sizing:border-box}body{margin:0;background:#15392d;color:var(--cream);font:18px system-ui,sans-serif}main{max-width:520px;margin:auto;padding:18px 16px 24px}header{display:flex;justify-content:space-between;align-items:center;font-weight:750}small{font-size:14px;color:#b7d4c3}h1{font-size:30px;line-height:1.1;margin:10px 0}p{line-height:1.5;margin:10px 0}.scene{position:relative;height:min(55vh,420px);min-height:260px;background:#f9edcc;border-radius:28px;overflow:hidden;margin:16px 0}canvas{width:100%;height:100%;display:block}.badge{position:absolute;top:16px;left:16px;padding:9px 14px;border-radius:16px;background:#fff9e7;color:var(--ink);font-weight:800}.cue{text-align:center;min-height:28px;font-weight:750}.meter{height:8px;background:#39614c;border-radius:8px;overflow:hidden}.meter i{display:block;width:0;height:100%;background:#9adeb3}button{font:inherit;border:0;min-height:48px;border-radius:20px;cursor:pointer;font-weight:800}#action{width:100%;min-height:88px;background:var(--yellow);color:var(--ink);font-size:28px;touch-action:manipulation;box-shadow:0 6px 0 #c9a143}#action:active{transform:translateY(3px);box-shadow:0 3px 0 #c9a143}#stop{background:transparent;color:var(--cream);display:block;margin:12px auto}#stats{display:flex;justify-content:space-between;font-size:14px;margin:12px 0}#result{background:#fff8df;color:var(--ink);border-radius:20px;padding:18px;margin-bottom:16px}#result[hidden]{display:none}#result h2{margin:0 0 8px;font-size:25px}.muted{font-size:14px;color:#b7d4c3}footer{font-size:12px;color:#b7d4c3;margin-top:20px}button:focus-visible{outline:4px solid white;outline-offset:4px}@media(prefers-reduced-motion:reduce){#action:active{transform:none}}@media(max-height:700px){.scene{height:300px;min-height:220px}h1{font-size:25px}main{padding-top:10px}}
</style>
<main><header><span>拍拍冒險</span><small>第一關 · 60 BPM</small></header><h1>把恐龍蛋帶回家</h1><p id="intro">先聽 4 拍。石頭來到腳下，跟鼓聲按一下「跳」！</p><div class="meter" aria-label="回巢進度"><i id="progress"></i></div><div class="scene"><canvas id="world" aria-label="恐龍帶著蛋，跟著拍子跨過石頭前往巢穴"></canvas><span class="badge" id="badge">目的地：溫暖的巢</span></div><div id="result" hidden></div><div class="cue" id="cue">16 個拍點，陪恐龍一路回家</div><div id="stats"><span id="hits">跨過 0 / 16</span><span id="combo">蛋準備好了</span></div><button id="action">出發！</button><button id="stop" hidden>停止這次冒險</button><p class="muted">用右手跟拍。慢一點也沒關係，下個拍子再接上。</p><footer>可玩的設計試稿；瀏覽器音訊與判定獨立，不保存 App 進度。原生版沿用 BeatLab 的音訊時鐘及判分。</footer></main>
<script>
const $=id=>document.getElementById(id),canvas=$('world'),ctx=canvas.getContext('2d');
const atlas=new Image();atlas.src='../../../BeatLab/Resources/Assets.xcassets/EggMissionAtlas.imageset/artwork.png';
const backdrop=new Image();backdrop.src='../../../BeatLab/Resources/Assets.xcassets/RunnerIsland.imageset/artwork.png';
const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
let audio,origin=0,active=false,ended=false,hits=new Map(),extra=0,last=null,streak=0,sounds=[],cancelled=false;
function sprite(index,x,y,size){if(!atlas.complete||!atlas.naturalWidth)return;const xs=[0,440,880,1254],ys=[0,478,933,1254],c=index%3,r=Math.floor(index/3),sw=xs[c+1]-xs[c],sh=ys[r+1]-ys[r],dw=size*sw/sh;ctx.drawImage(atlas,xs[c],ys[r],sw,sh,x-dw/2,y-size,dw,size)}
function elapsed(){return active?audio.currentTime-origin:ended?20:0}
function tone(t,f,d,g,kind='sine'){let o=audio.createOscillator(),v=audio.createGain();o.type=kind;o.frequency.setValueAtTime(f,t);v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v).connect(audio.destination);o.start(t);o.stop(t+d);sounds.push(o)}
function groove(){for(let b=0;b<20;b++){const t=origin+b;tone(t,b%4===0?1200:900,.045,.055);if(b>=4){if(b%2===0)tone(t,110,.19,.09);else tone(t,190,.09,.06,'triangle');tone(t+.5,4700,.018,.016,'square')}}}
async function start(){audio??=new AudioContext();await audio.resume();origin=audio.currentTime+.15;active=true;ended=false;cancelled=false;hits=new Map();extra=0;last=null;streak=0;$('result').hidden=true;$('action').textContent='跳！';$('stop').hidden=false;$('intro').textContent='守護恐龍蛋，跟著鼓声前進。';groove()}
function tap(){if(!active)return start();const now=elapsed();if(now<3.82||now>20.18)return;const id=Math.min(15,Math.max(0,Math.round(now-4))),error=now-(4+id);if(Math.abs(error)<=.18&&!hits.has(id)){const perfect=Math.abs(error)<=.05;hits.set(id,{perfect,error});streak=perfect?streak+1:0;last={time:now,id,kind:perfect?'perfect':'matched'};tone(audio.currentTime,perfect?1320:660,.035,.04);$('cue').textContent=perfect?'漂亮！蛋亮起來了':error<0?'跳過了，下一拍稍等一下':'跳過了，下一拍早一點';}else{extra++;streak=0;last={time:now,kind:'extra'};tone(audio.currentTime,220,.03,.03);$('cue').textContent='先站穩，聽下一拍再跳'}update()}
function finish(){active=false;ended=true;const perfect=[...hits.values()].filter(x=>x.perfect).length,passed=hits.size/16>=.85&&perfect/16>=.55&&extra/16<=.1;$('result').hidden=false;$('result').innerHTML=`<h2>${passed?'蛋安全回到巢了！':'恐龍接住蛋了，再試一次'}</h2><p>跨過 ${hits.size} / 16 · 漂亮 ${perfect} 拍 · 多打 ${extra} 下</p><p>${passed?'你的節奏讓這趟冒險成功了。':'跟著鼓聲跳，慢慢來也可以。'}</p>`;$('action').textContent='再走一趟';$('stop').hidden=true;$('cue').textContent=passed?'任務完成！':'跟著拍子，再把蛋帶回家';update()}
function stop(){for(const o of sounds){try{o.stop()}catch{}}sounds=[];active=false;ended=false;cancelled=true;$('action').textContent='重新出發';$('stop').hidden=true;$('cue').textContent='這次已停止，不計成績';$('result').hidden=true;update()}
function update(){const t=elapsed();$('hits').textContent=`跨過 ${hits.size} / 16`;$('combo').textContent=streak>=2?`連續 ${streak} 拍漂亮！`:extra?`多打 ${extra} 下`:'蛋在你手上';$('progress').style.width=`${Math.min(100,Math.max(0,(t-4)/16*100))}%`}
function draw(){const r=canvas.getBoundingClientRect(),d=devicePixelRatio;canvas.width=r.width*d;canvas.height=r.height*d;ctx.scale(d,d);const w=r.width,h=r.height,t=elapsed(),p=t-4,ground=h*.83,px=w*.26,stride=w*.32;if(backdrop.complete&&backdrop.naturalWidth){ctx.drawImage(backdrop,0,0,w,h)}else{ctx.fillStyle='#fff2cf';ctx.fillRect(0,0,w,h)}
// Clear gameplay ground distinguishes interactive rocks from scenery decorations.
ctx.fillStyle='#a8d985';ctx.fillRect(0,ground,w,12);ctx.fillStyle='#d9ad69';ctx.fillRect(0,ground+12,w,h-ground);
for(let i=0;i<16;i++){const x=px+(i-(reduced?Math.floor(p):p))*stride;if(x< -80||x>w+80)continue;const missed=t>4+i+.43&&!hits.has(i);if(hits.has(i)){ctx.fillStyle='#ffd550';ctx.font='26px system-ui';ctx.fillText('✦',x-10,ground-14)}else{sprite(8,x,ground+5,74);if(missed){ctx.fillStyle='#9d5137';ctx.font='23px system-ui';ctx.fillText('↶',x-10,ground-64)}}}
let age=last?t-last.time:99;const missID=Math.floor(t-4-.43),missRecent=active&&missID>=0&&missID<16&&!hits.has(missID)&&t-(4+missID+.43)<.45;let pose=active?(Math.floor(t*5)%2):2,hop=0;
if(age<.5){pose=last.kind==='extra'?2:3;hop=reduced?0:Math.sin(Math.PI*Math.min(1,age/.5))*(last.kind==='extra'?12:74)}else if(missRecent)pose=4;if(ended)pose=hits.size/16>=.85&&[...hits.values()].filter(x=>x.perfect).length/16>=.55&&extra/16<=.1?5:4;
sprite(pose,px,ground+9-hop,Math.min(145,w*.37));const nestX=ended?w*.72:px+(16-(reduced?Math.floor(p):p))*stride;sprite(7,Math.min(w*1.4,nestX),ground+12,124);
if(active&&t<4){$('cue').textContent=`先聽 ${Math.max(1,4-Math.floor(Math.max(0,t)))} 拍，準備跳`;$('badge').textContent='聽鼓聲，準備出發'}else if(active){$('badge').textContent='把蛋帶回巢';if(missRecent&&age>.5)$('cue').textContent='接住了！下一拍再跳';}else $('badge').textContent=ended?'巢就在這裡':'目的地：溫暖的巢';if(active&&t>=20.18)finish();update();requestAnimationFrame(draw)}
$('action').addEventListener('pointerdown',e=>{e.preventDefault();tap()});$('action').addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();tap()}});$('stop').onclick=stop;document.addEventListener('visibilitychange',()=>{if(document.hidden&&active)stop()});requestAnimationFrame(draw);
</script></html>
